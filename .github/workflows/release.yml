name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ''
          - os: windows-latest
            goos: windows
            ext: '.exe'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        cache-dependency-path: rom_tool/go/go.sum

    - name: Build binary
      working-directory: ./rom_tool/go
      shell: bash
      run: |
        mkdir -p ../bin
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT="rom_tool-windows-x64.exe"
        else
          OUTPUT="rom_tool-linux-x64"
        fi
        GOOS=${{ matrix.goos }} GOARCH=amd64 go build -trimpath -o ../bin/${OUTPUT} .

    - name: Upload binary for release
      uses: actions/upload-artifact@v4
      with:
        name: rom_tool-${{ matrix.goos }}-amd64
        path: rom_tool/bin/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Flatten artifacts
      run: |
        mkdir -p release
        find ./artifacts -type f -exec mv {} ./release/ \;

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/rom_tool-linux-x64
          release/rom_tool-windows-x64.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
